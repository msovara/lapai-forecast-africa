# Track A Step A1 — FULL coarsening fine-tune on 2020–2021 O96 Zarr
# (smoke config remains configs/trackA_coarsen.yaml)
#
# Prerequisites:
#   1. data/processed/lapai/era5_n96_2020_2021.zarr complete + statistics (laptop)
#   2. rsync Zarr + this repo to Lengau
#   3. Teacher warm-start: models/teacher_n320_gt6/inference.ckpt on Lengau
#   4. qsub pbs/trackA_full.pbs   (from repo root on Lengau)
#
# After train: forecast → score → gate (same as smoke; see scripts/run_trackA_closure.py)

input_grid: N320
target_grid: N96
processor_mesh: O48
interp: bilinear

gate:
  baseline_scorecard: reports/PHASE0_BASELINE_SCORECARD.json
  leads_hours: [24, 48]
  variables: [t2m, u10, v10]
  max_rmse_degradation_pct: 5.0

anemoi:
  dataset: data/processed/lapai/era5_n96_2020_2021.zarr
  warm_start: models/teacher_n320_gt6/inference.ckpt
  output_root: models/trackA_coarsen_full_runs
  output_ckpt: models/teacher_coarsened.ckpt
  processor_resolution: 6
  # ~2000 steps ≈ substantial A1 fine-tune on V100 (raise toward 5000+ or set max_epochs
  # if walltime allows). Smoke used 50 steps on the incomplete 2018 Q1 Zarr.
  max_steps: 2000
  max_epochs: null
  load_weights_only: true
  hydra_overrides:
    - training.precision="32"
    # Full 2020–2021 Zarr (2924 × 6h). 85/15 time split.
    - dataloader.training.datasets.data.start=2020-01-01
    - dataloader.training.datasets.data.end=2021-09-12
    - dataloader.validation.datasets.data.start=2021-09-13
    - dataloader.validation.datasets.data.end=2021-12-31
    # Same capacity as the successful smoke (safe on 32GB V100); scale up later if needed.
    - model.num_channels=256
    - model.processor.num_layers=8
    - +graph.edges.1.edge_builders.0.scale_resolutions=[1]
    - dataloader.num_workers.training=2
    - dataloader.num_workers.validation=2

forecast:
  inits: [20230101, 20230108, 20230115, 20230122, 20230129]
  init_time: "0000"
  lead_time_hours: 240
  forecast_dir: data/processed/trackA/forecasts
  scorecard_out: reports/TRACKA_COARSEN_SCORECARD.json
  teacher_config: configs/teacher_n320_gt6.yaml
  checkpoint: models/teacher_coarsened.ckpt
  ic_source: cds
  cds_cache_dir: ~/.cache/aifs-africa/era5

notes: >-
  Full A1 train on era5_n96_2020_2021.zarr. After checkpoint lands, run
  scripts/run_trackA_closure.py (forecast + score) then gate vs Phase 0.
  Rematerialise forecasts on the 70E Africa box when regenerating eval NetCDFs.
