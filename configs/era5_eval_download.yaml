# ERA5 ground-truth download for the Mvua evaluation protocol (configs/eval.yaml).
# Used by scripts/download_era5_eval_truth.py — period/domain/variables follow eval.yaml.

output:
  grib_dir: data/raw/lapai/era5/eval/grib
  zarr_path: data/processed/lapai/era5_eval_truth_africa.zarr

cds:
  dataset: reanalysis-era5-single-levels
  product_type: reanalysis
  # 6-hourly steps (matches temporal_resolutions: 6h in eval.yaml)
  times: ["00:00", "06:00", "12:00", "18:00"]
  format: grib
  # One CDS job per calendar year (avoids huge single requests for 2023-2025)
  chunk: year

# CDS API variable names (scorecard short names -> CDS)
variable_map:
  t2m: 2m_temperature
  tp: total_precipitation
  u10: 10m_u_component_of_wind
  v10: 10m_v_component_of_wind

# GRIB shortName -> scorecard name when converting to Zarr
grib_rename:
  "2t": t2m
  tp: tp
  "10u": u10
  "10v": v10
