# Track A A1b — GraphTransformer O96 fine-tune (prerequisite for A2 head pruning)
#
# Why: A1 (configs/trackA_coarsen_full*.yaml) used model=gnn for V100 memory.
# GNN has no attention heads, so PLAN §4.2 pruning cannot run on teacher_coarsened.ckpt.
# This job warm-starts GraphTransformer from n320_gt6 onto the O96 Zarr / O48 processor.
#
# Submit (32 GiB host pin):
#   LAPAI_TRACKA_CONFIG=configs/trackA_gt_coarsen.yaml LAPAI_SKIP_GATE=1 \
#     qsub -v LAPAI_TRACKA_CONFIG,LAPAI_SKIP_GATE pbs/trackA_full.pbs
# Or: bash scripts/submit_trackA_gt_coarsen_32gb.sh
#
# After Exit 0: point models/teacher_gt_coarsened.ckpt → inference-last.ckpt
# Then run A2: configs/trackA_prune.yaml

input_grid: N320
target_grid: N96
processor_mesh: O48
interp: bilinear

gate:
  baseline_scorecard: reports/PHASE0_BASELINE_SCORECARD.json
  leads_hours: [24, 48]
  variables: [t2m, u10, v10]
  max_rmse_degradation_pct: 5.0

anemoi:
  dataset: data/processed/lapai/era5_n96_2020_2021.zarr
  warm_start: models/teacher_n320_gt6/inference.ckpt
  output_root: models/trackA_gt_coarsen_runs
  output_ckpt: models/teacher_gt_coarsened.ckpt
  processor_resolution: 6
  max_steps: 2000
  max_epochs: null
  load_weights_only: true
  model: graphtransformer
  hydra_overrides:
    - training.precision="32"
    - dataloader.training.datasets.data.start=2020-01-01
    - dataloader.training.datasets.data.end=2021-09-12
    - dataloader.validation.datasets.data.start=2021-09-13
    - dataloader.validation.datasets.data.end=2021-12-31
    # Reduced vs full n320_gt6 (1024/16/16) to fit 32 GiB V100; raise if OOM-free.
    - model.num_channels=256
    - model.processor.num_layers=8
    - model.processor.num_heads=16
    - +graph.edges.1.edge_builders.0.scale_resolutions=[1]
    - dataloader.num_workers.training=2
    - dataloader.num_workers.validation=2

forecast:
  inits: [20230101, 20230108, 20230115, 20230122, 20230129]
  init_time: "0000"
  lead_time_hours: 240
  forecast_dir: data/processed/trackA_gt/forecasts
  scorecard_out: reports/TRACKA_GT_COARSEN_SCORECARD.json
  teacher_config: configs/teacher_n320_gt6.yaml
  checkpoint: models/teacher_gt_coarsened.ckpt
  ic_source: cds
  cds_cache_dir: ~/.cache/aifs-africa/era5

notes: >-
  A1b GraphTransformer O96 fine-tune so A2 can soft-mask attention heads.
  Capacity matches A1 GNN (256 ch / 8 layers) but with num_heads=16.
