huggingface_repo_id: ecmwf/aifs-single-1.0
# HF artefact name on main as of pinned revision (single v1.0 MSE release).
checkpoint_filename: aifs-single-mse-1.0.ckpt
# Pin reproducible snapshot (also used by huggingface_hub when --revision is set).
revision: f0bb02c077e65a516dadc018c31bc5ddf65ff829

local_checkpoint_relative: models/teacher/aifs-single-mse-1.0.ckpt

# PLAN placeholders for full AIFS (often ≥16 processor layers) — keep for reference.
layer_map:
  feature_L10: 10
  feature_L14: 14

# Live K1 GraphTransformer (Track A accepted): processor.proc ModuleList length 8.
# Depth-proportional map of PLAN L10/L14 → indices used by build_teacher_feature_cache.py.
layer_map_k1:
  feature_L10: 5
  feature_L14: 7
  num_layers: 8
  note: >-
    L10/L14 were AIFS placeholders. On K1, hook processor.proc[5] and [7]
    (~10/16 and ~14/16 of an 8-layer stack).

