# Track A Step A1 — grid coarsening (PLAN §4.1)
input_grid: N320
target_grid: N96
processor_mesh: O48
interp: bilinear

# Short-lead gate vs Phase 0 teacher baseline (Africa eval grid).
gate:
  baseline_scorecard: reports/PHASE0_BASELINE_SCORECARD.json
  leads_hours: [24, 48]
  variables: [t2m, u10, v10]
  max_rmse_degradation_pct: 5.0

# Anemoi-training — Zarr built on laptop; synced to Lengau.
anemoi:
  dataset: data/processed/lapai/era5_n96_smoke.zarr
  warm_start: models/teacher_n320_gt6/inference.ckpt
  output_root: models/trackA_coarsen_runs
  output_ckpt: models/teacher_coarsened.ckpt
  processor_resolution: 6
  max_steps: 50
  max_epochs: null
  load_weights_only: true
  hydra_overrides:
    # V100 GPUs have no native bf16; the default 16-mixed AMP overflows fp16 (65504) on
    # warm-started coarsening and yields intermittent NaN losses. Full fp32 removes the
    # overflow path (gradient_clip val=32 is already on by default but can't fix a NaN
    # forward loss). Cheap for an 8.9M-param, 50-step smoke run.
    - training.precision="32"
    # anemoi-training 0.14 native_grid dataloader nests dates under datasets.data.
    # The smoke Zarr build left 90/360 timesteps unwritten (whole-step NaN); restrict
    # to the largest contiguous NaN-free window (idx 100-340 = 2018-01-26..2018-03-27).
    # See scripts/diagnose_zarr_stats.py --scan-data. Rebuild the Zarr later for full Q1.
    - dataloader.training.datasets.data.start=2018-01-26
    - dataloader.training.datasets.data.end=2018-03-18
    - dataloader.validation.datasets.data.start=2018-03-19
    - dataloader.validation.datasets.data.end=2018-03-26
    - model.num_channels=256
    - model.processor.num_layers=8
    - +graph.edges.1.edge_builders.0.scale_resolutions=[1]
    - dataloader.num_workers.training=2
    - dataloader.num_workers.validation=2

# Forecast + score paths (same inits as Phase 0; swap checkpoint after A1 train).
forecast:
  inits: [20230101, 20230108, 20230115, 20230122, 20230129]
  init_time: "0000"
  lead_time_hours: 240
  forecast_dir: data/processed/trackA/forecasts
  scorecard_out: reports/TRACKA_COARSEN_SCORECARD.json
  teacher_config: configs/teacher_n320_gt6.yaml
  checkpoint: models/teacher_coarsened.ckpt
  ic_source: cds
  cds_cache_dir: ~/.cache/aifs-africa/era5

notes: >-
  SMOKE only (50 steps, 2018 Q1 Zarr). For the full 2020–2021 fine-tune use
  configs/trackA_coarsen_full.yaml and pbs/trackA_full.pbs.
  After coarsened processor fine-tune, forecast the same Phase 0 inits, score with
  run_phase0_closure.py --score-only, then: python scripts/run_trackA_gate.py
  --candidate reports/TRACKA_COARSEN_SCORECARD.json
