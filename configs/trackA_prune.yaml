# Track A Step A2 — attention-head pruning (PLAN §4.2)
#
# PREREQUISITE: warm_start must be a GraphTransformer checkpoint (num_heads>0).
# The A1 GNN coarsened teacher (model=gnn) has NO attention heads — do not point
# warm_start at models/teacher_coarsened.ckpt from the GNN A1 run.
#
# Recommended order:
#   1) Fine-tune GraphTransformer on O96 Zarr  → configs/trackA_gt_coarsen.yaml
#   2) Round-1 soft-mask prune (10% / 2 of 16 heads) + recovery fine-tune (this file)
#   3) Forecast → score (include tp) → A2 gate ≤3% RMSE proxy vs A1 scorecard
#
# Driver:
#   $LAPAI_PYTHON training/train_trackA.py --step prune --config configs/trackA_prune.yaml
#   qsub -v LAPAI_TRACKA_CONFIG=configs/trackA_prune.yaml pbs/trackA_prune.pbs

input_grid: N320
target_grid: N96
processor_mesh: O48
interp: bilinea

prune:
  fraction_per_round: 0.10
  max_rounds: 3
  # With 16 heads, 10% → drop 2 heads (12.5%).
  method: soft_mask_weights  # zero head slices in lin_q/k/v/self/edge + projection
  importance: weight_l1  # offline; activation_grad when batch hooks available
  scope: [processor]  # processor | encoder | decoder | all
  round: 1

gate:
  # A2 gate vs A1 coarsened skill (not Phase 0). Include tp per PLAN.
  baseline_scorecard: reports/TRACKA_COARSEN_SCORECARD.json
  leads_hours: [24, 48]
  variables: [t2m, u10, v10, tp]
  # PLAN: <3% CRPS; MVP uses area-weighted RMSE as deterministic CRPS proxy.
  max_rmse_degradation_pct: 3.0
  metric_note: deterministic_rmse_proxy_for_crps

anemoi:
  dataset: data/processed/lapai/era5_n96_2020_2021.zar
  # Must be GraphTransformer O96 ckpt from trackA_gt_coarsen (A1b), not GNN A1.
  warm_start: models/teacher_gt_coarsened.ckpt
  output_root: models/trackA_prune_runs
  output_ckpt: models/teacher_pruned.ckpt
  masked_ckpt: models/teacher_pruned_masked.ckpt
  processor_resolution: 6
  # Recovery fine-tune after mask (PLAN: ~2 epochs @ 5e-5; steps ≈ short).
  max_steps: 2000
  max_epochs: null
  load_weights_only: true
  model: graphtransforme
  hydra_overrides:
    - training.precision="32"
    - dataloader.training.datasets.data.start=2020-01-01
    - dataloader.training.datasets.data.end=2021-09-12
    - dataloader.validation.datasets.data.start=2021-09-13
    - dataloader.validation.datasets.data.end=2021-12-31
    # Keep capacity aligned with A1b GT coarsen run (edit if A1b uses different dims).
    - model.num_channels=256
    - model.processor.num_layers=8
    - model.processor.num_heads=16
    - +graph.edges.1.edge_builders.0.scale_resolutions=[1]
    - dataloader.num_workers.training=2
    - dataloader.num_workers.validation=2
    - training.lr.rate=5.0e-5

forecast:
  inits: [20230101, 20230108, 20230115, 20230122, 20230129]
  init_time: "0000"
  lead_time_hours: 240
  forecast_dir: data/processed/trackA_prune/forecasts
  scorecard_out: reports/TRACKA_PRUNE_SCORECARD.json
  teacher_config: configs/teacher_n320_gt6.yaml
  checkpoint: models/teacher_pruned.ckpt
  ic_source: cds
  cds_cache_dir: ~/.cache/aifs-africa/era5

# Legacy knobs (kept for older scripts)
crps_gate_pct: 3.0
prune_fraction_per_round: 0.10
max_rounds: 3

notes: >-
  A2 round 1: soft-mask lowest-importance heads then recovery fine-tune.
  See reports/TRACKA_A2_START.md.
