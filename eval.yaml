# LapAI evaluation protocol.
# Ground truth: ERA5. Test period: 2023-2025. Compare forecasts (variable resolutions) vs ERA5.
# Variables (ERA5): 2 m temperature, total precipitation, 10 m u/v wind. Rainfall is a priority.

ground_truth: era5
test_period:
  start: "2023-01-01"
  end: "2025-12-31"

# Forecast lead times to score (hours).
leads_hours: [24, 48, 72, 120, 168, 240]

# Canonical short names scored by evaluation/eval_skill.py
variables: [t2m, tp, u10, v10]

# Temporal aggregations for scoring (precipitation in particular).
temporal_resolutions: [6h, daily]

# Evaluation domain. Forecasts are generated globally (teacher runs global), but scoring
# defaults to the African sub-domain to cut memory/storage/runtime for fast iteration.
# Use --domain global for full-grid benchmark runs on HPC.
domain:
  default: africa
  regions:
    africa:
      # Aligned with graphcast-africa: continental Africa + Madagascar / WIO to 70E.
      lat: [-40.0, 40.0]
      lon: [-20.0, 70.0]
    global:
      lat: [-90.0, 90.0]
      lon: [-180.0, 180.0]

# Forecasts are generated across variable resolutions and stored alongside ERA5 in the joint bucket.
notes: >-
  Joint storage bucket (to be created) holds ERA5 ground truth + generated forecasts.
  Global dataset is the source; Africa is the default evaluation window. Precipitation (tp)
  weighted as a key metric for the Mvua team.