[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lapai-inference"
version = "0.1.0"
description = "LapAI-Forecast student CNN, distillation utilities, and ONNX CPU inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
ort = ["onnx>=1.16", "onnxruntime>=1.17", "onnxscript>=0.1"]
data = ["zarr>=2.16", "h5py>=3.10", "xarray>=2024.1", "pyyaml>=6"]
hf = ["huggingface_hub>=0.21"]
cds = ["cdsapi>=0.6"]
forecast = [
  "ecmwf-opendata>=0.3.29",
  "earthkit-regrid>=0.4",
  "earthkit-data<1",
  "matplotlib>=3.8",
  "netCDF4>=1.6",
  "pyyaml>=6",
]

[project.scripts]
lapai-inference = "lapai_inference.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lapai_inference*", "utils*", "evaluation*", "training*", "inference*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]