# ERA5 pipeline coarsened for Track A (~1°, O96/N96).
# Preferred: subset ECMWF public O96 Zarr (see recipe_era5_o96_from_ecmwf_smoke.yaml).
# Fallback: CDS GRIB under data/raw/lapai/era5/n320/ + regrid below.

dates:
  start: 1979-01-01T00:00:00Z
  end: 2018-12-31T18:00:00Z
  frequency: 6h

input:
  pipe:
    - grib:
        param: [2t, 10u, 10v, msl, sp, tp]
        path: data/raw/lapai/era5/n320/*.grib
    - regrid:
        method: linear
        in_grid: [0.25, 0.25]
        out_grid: O96

output:
  dtype: float32
  chunking:
    dates: 1
    ensembles: 1
  path: data/processed/lapai/era5_n96.zarr
