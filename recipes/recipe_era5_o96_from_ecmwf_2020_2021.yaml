# Track A medium subset — two years from ECMWF public O96 ERA5 (AIFS doc sample window).
# Use after smoke succeeds and before committing to the full 0.5 TB copy.
#
#   python scripts/build_trackA_era5_zarr.py --recipe recipes/recipe_era5_o96_from_ecmwf_2020_2021.yaml

name: lapai-era5-o96-2020-2021-v1
description: Track A — 2020–2021 O96 subset from ECMWF public ERA5
attribution: ECMWF/C3S
licence: CC-BY-4.0

dates:
  start: 2020-01-01T00:00:00
  end: 2021-12-31T18:00:00
  frequency: 6h

input:
  anemoi-dataset:
    dataset: https://data.ecmwf.int/anemoi-datasets/era5-o96-1979-2023-6h-v8.zarr

output:
  dtype: float32
  chunking:
    dates: 1
    ensembles: 1
  path: data/processed/lapai/era5_n96_2020_2021.zarr
