# Track A smoke Zarr from local CDS GRIB (fallback — prefer recipe_era5_o96_from_ecmwf_smoke.yaml).
# GRIB: python scripts/download_trackA_era5_grib.py --smoke

name: lapai-era5-n96-grib-smoke-v1
description: Track A smoke from 0.25 deg CDS GRIB regridded to O96

dates:
  start: 2018-01-01T00:00:00
  end: 2018-03-31T18:00:00
  frequency: 6h

input:
  pipe:
    - grib:
        param: [2t, 10u, 10v, msl, sp, tp]
        path: data/raw/lapai/era5/n320/*.grib
    - regrid:
        method: linear
        in_grid: [0.25, 0.25]
        out_grid: O96

output:
  dtype: float32
  chunking:
    dates: 1
    ensembles: 1
  path: data/processed/lapai/era5_n96_smoke.zarr
